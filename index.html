<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>p5.js Shape Editor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://cdn.jsdelivr.net/npm/p5@2.2.3/lib/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <style>
      /* --- 既存のスタイル --- */
      body {
        margin: 0;
        padding: 0;
        background-color: var(--opening-background, #000000);
        overflow: hidden;
        touch-action: none;
      }
      canvas {
        display: block;
        touch-action: none;
        z-index: 10;
        position: relative;
      }

      .debug-mode-indicator {
        position: fixed;
        top: 18px;
        left: 20px;
        z-index: 30;
        color: var(--opening-foreground, #000);
        font-family: Arial, sans-serif;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        line-height: 1;
        pointer-events: none;
      }

      .debug-image-control {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 30;
        display: flex;
        align-items: center;
        gap: 20px;
        color: var(--opening-foreground, #000);
        font-family: Arial, sans-serif;
        font-size: clamp(18px, 2vw, 30px);
        font-weight: 600;
        line-height: 1;
        user-select: none;
      }

      .debug-image-toggle {
        position: relative;
        width: 88px;
        height: 48px;
        padding: 0;
        border: 6px solid currentColor;
        border-radius: 999px;
        background: #fff;
        color: inherit;
        cursor: pointer;
        touch-action: manipulation;
      }

      .debug-image-toggle::after {
        position: absolute;
        top: 5px;
        left: 5px;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: currentColor;
        content: '';
        transition: transform 160ms ease;
      }

      .debug-image-toggle.is-on::after {
        transform: translateX(36px);
      }

      .save-artwork-button {
        position: fixed;
        top: 18px;
        right: 24px;
        z-index: 30;
        padding: 8px 14px;
        border: 4px solid var(--opening-foreground, #000);
        border-radius: 999px;
        background: #fff;
        color: var(--opening-foreground, #000);
        font-family: Arial, sans-serif;
        font-size: clamp(16px, 1.6vw, 24px);
        font-weight: 600;
        line-height: 1.1;
        cursor: pointer;
        touch-action: manipulation;
      }

      .panel-title {
        color: var(--label-color, white);
        font-family: var(--app-font, Arial, sans-serif);
        font-size: var(--label-size, 16px);
        margin-bottom: 5px;
      }
      .hull-list-item {
        color: white;
        font-family: var(--app-font, Arial, sans-serif);
        cursor: pointer;
        padding: 5px;
        background: #555;
        margin-bottom: 5px;
        border-radius: 3px;
      }
      .hull-list-item:hover {
        background: #777;
      }

    </style>
  </head>
  <body>
    <main></main>

    <!-- スクリプト読み込み -->
    <script src="parameters.js"></script>
    <script src="theme.js"></script>
    <script src="sketch.js"></script>
    <script src="convex_hull.js"></script>
    <script src="shape.js"></script>
    <script src="mode_UI.js"></script>
    <script src="hull_group.js"></script>
    <script src="touch.js"></script>
    <script src="monotone_Chain.js"></script>
  </body>
</html>
